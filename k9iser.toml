#
# k9iser manifest for odds-and-sods-package-manager
# Odds and Sods multi-ecosystem package manager

[project]
name = "odds-and-sods-package-manager"
safety_tier = "yard"

[[source]]
path = "Justfile"
type = "justfile"
output = "generated/k9iser/justfile-recipes.k9"

[[source]]
path = ".github/workflows/hypatia-scan.yml"
type = "workflow"
output = "generated/k9iser/ci-security.k9"

[[constraint]]
rule = "workflows includes hypatia-scan"
severity = "error"
