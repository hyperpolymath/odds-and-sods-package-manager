#
# ci-bootstrap.yml — TEMPORARY. Delete after use.
#
# This branch was prepared in an environment with no Elixir, Erlang or Rust
# toolchain and no route to hex.pm or crates.io. Four things could therefore not
# be produced there, and each is a *mechanical* product of a toolchain rather
# than a design decision:
#
#   1. `mix format` — this repository has never been format-checked. `ci.yml`
#      (new in this branch) adds the check and it fails. The drift is
#      pre-existing and repo-wide; only the pinned formatter can remove it.
#   2. `mix test` — the ~850-test suite had never run in CI. This job captures
#      the failure text, which the Actions log API does not expose here.
#   3. `Cargo.lock` for the two NIF crates under opsm_ex/native/ — neither had a
#      committed lock (`.gitignore` ignored them), so `cargo build --locked`
#      failed before compiling anything. Only cargo can mint a lock that matches
#      the manifests.
#   4. Recon — `pons-asinorum` and `panic-attack` publish no installable
#      binaries (panic-attack v1.0.1: zero release assets; pons-asinorum: no
#      release at all), so both must be built from source on a machine that has
#      cargo. Their reports are committed beside this file's report.
#
# Everything learned goes to .ci-bootstrap/report.txt, and the whole directory
# is committed and pushed back to the branch this ran on. The log API is not
# reachable from where this branch was prepared; git is.
#
# It is not a gate, it is not required, and it is deleted once it has done its
# job. Nothing here weakens a check: Formatter, Mix test, Build (locked) and the
# rest of ci.yml stay exactly as strict as they are, and have to pass on their
# own merits afterwards.
#
# Triggers only on a change to this file (i.e. the commit that adds it) and on
# manual dispatch, so it can never run as part of an ordinary pull request.
name: CI bootstrap (temporary)

on:
  push:
    paths:
      - '.github/workflows/ci-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: ci-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Recon inputs. Both are source-only tools: no release asset exists to pin, so
  # the pin is the commit the clone is made from and `git rev-parse HEAD` is
  # recorded in the report to prove which one was actually analysed.
  PONS_REPO: https://github.com/hyperpolymath/pons-asinorum
  PONS_SHA: 51b8920f541782ceb9465ea3f0d33c96104fc1fb
  PANIC_REPO: https://github.com/hyperpolymath/panic-attack
  PANIC_SHA: b5530834a839734d1d181bfe6edb0d43d4233cf4

jobs:
  bootstrap:
    name: Produce the toolchain artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the branch this ran on
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Erlang/Elixir from .tool-versions
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: '.tool-versions'
          version-type: 'strict'

      - name: Install Rust (the pin in .tool-versions comments)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.97.0'

      - name: Run the toolchain and record everything
        # No `set -e`: the point of this step is to keep going and record what
        # each command did. Every command goes through `run`, which captures the
        # exit code into the report. The step itself ends with `exit 0` so the
        # commit step always gets something to commit.
        run: |
          set +e
          set -uo pipefail
          out=.ci-bootstrap/report.txt
          mkdir -p .ci-bootstrap/recon
          {
            echo "# CI bootstrap report"
            echo
            echo "Generated by .github/workflows/ci-bootstrap.yml."
            echo "Commit: ${GITHUB_SHA}. Runner: ${RUNNER_OS} $(uname -m)."
            echo
            echo '## Versions'
            echo '```'
            elixir --version 2>&1
            cargo --version 2>&1
            rustc --version 2>&1
            git --version 2>&1
            echo '```'
          } > "$out"

          section() { printf '\n## %s\n\n```\n' "$1" >> "$out"; }
          close() { printf '```\n' >> "$out"; }

          # run LABEL CMD... — record the command, its output and its exit code.
          run() {
            local label="$1"; shift
            echo "::group::${label}"
            section "$label"
            "$@" >> "$out" 2>&1
            local rc=$?
            close
            printf '\nexit code: **%s**\n' "$rc" >> "$out"
            tail -5 "$out" | sed 's/^/  /'
            echo "::endgroup::"
            return 0
          }

          # make_hex — a fresh Elixir has no Hex, and `mix deps.get` would fail
          # on the prompt rather than install it.
          run 'mix local.hex --force' bash -lc 'cd opsm_ex && mix local.hex --force'
          run 'mix local.rebar --force' bash -lc 'cd opsm_ex && mix local.rebar --force'
          run 'mix deps.get' bash -lc 'cd opsm_ex && mix deps.get'

          # 1. Format. This is the one step whose *purpose* is to change files.
          run 'mix format (rewrites files)' bash -lc 'cd opsm_ex && mix format'
          run 'git status after mix format' git status --porcelain
          run 'mix format --check-formatted' bash -lc 'cd opsm_ex && mix format --check-formatted'

          # 2. Strict compile — the second half of the lint job.
          run 'mix compile --warnings-as-errors' bash -lc 'cd opsm_ex && mix compile --warnings-as-errors'

          # 3. The suite, with the Proven-Tests reporter on, exactly as ci.yml
          #    runs it. The last 500 lines hold the summary and every failure.
          section 'mix test --cover (last 500 lines)'
          ( cd opsm_ex && MIX_ENV=test OPSM_PROVEN_REPORT=1 mix test --cover 2>&1 | tail -500 ) >> "$out" 2>&1
          printf '\n```\n' >> "$out"
          run 'validate_proven.exs' bash -lc 'cd opsm_ex && mix run --no-start scripts/validate_proven.exs'
          run 'proven_summary.exs' bash -lc 'cd opsm_ex && mix run --no-start scripts/proven_summary.exs'

          # 4. Lockfiles for the two NIF crates, then the honest question: does
          #    each crate build once it has a lock?
          for crate in opsm_pq_nif quic_transport; do
            d="opsm_ex/native/${crate}"
            [ -f "$d/Cargo.toml" ] || continue
            run "cargo generate-lockfile (${crate})" bash -lc "cd '$d' && cargo generate-lockfile"
            run "cargo build --locked (${crate})" bash -lc "cd '$d' && cargo build --locked 2>&1 | tail -40"
          done

          # 5. Recon: pons-asinorum (falsifier-first static analysis).
          run 'clone pons-asinorum' git clone --depth 1 "${PONS_REPO}" /tmp/pons-src
          run 'pons-asinorum HEAD' git -C /tmp/pons-src rev-parse HEAD
          run 'cargo build --release --locked (pons-asinorum)' \
            bash -lc 'cd /tmp/pons-src && cargo build --release --locked 2>&1 | tail -40'
          section 'pons scan . --format json --no-speculative'
          /tmp/pons-src/target/release/pons scan . --format json --no-speculative \
            > .ci-bootstrap/recon/pons-scan.json 2> .ci-bootstrap/recon/pons-scan.err
          echo "exit code: $?" >> "$out"; close
          run 'pons catalogue' bash -lc '/tmp/pons-src/target/release/pons catalogue > .ci-bootstrap/recon/pons-catalogue.json'
          run 'pons doctor' bash -lc '/tmp/pons-src/target/release/pons doctor'
          wc -c .ci-bootstrap/recon/pons-scan.json .ci-bootstrap/recon/pons-catalogue.json >> "$out" 2>&1

          # 6. Recon: panic-attack (assail = static analysis of a source tree).
          run 'clone panic-attack' git clone --depth 1 "${PANIC_REPO}" /tmp/panic-src
          run 'panic-attack HEAD' git -C /tmp/panic-src rev-parse HEAD
          run 'cargo build --release --locked (panic-attack)' \
            bash -lc 'cd /tmp/panic-src && cargo build --release --locked 2>&1 | tail -40'
          section 'panic-attack assail . --headless'
          /tmp/panic-src/target/release/panic-attack assail . --output .ci-bootstrap/recon/panic-assail.json --headless \
            > .ci-bootstrap/recon/panic-assail.log 2>&1
          echo "exit code: $?" >> "$out"; close
          run 'panic-attack --version' /tmp/panic-src/target/release/panic-attack --version
          wc -c .ci-bootstrap/recon/panic-assail.json .ci-bootstrap/recon/panic-assail.log >> "$out" 2>&1

          # 7. What changed, then commit it (in the next step, always()).
          section 'git status after the run'
          git status --porcelain >> "$out" 2>&1
          close
          section 'git diff --stat'
          git diff --stat >> "$out" 2>&1
          close
          exit 0

      - name: Commit the products and push them back to this branch
        # `always()` because a failed bootstrap is exactly when the report is
        # worth the most: it is the only readable account of what happened.
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ci-bootstrap'
          git config user.email 'ci-bootstrap@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit — the toolchain produced no change"
            exit 0
          fi
          git commit -m 'chore(ci): toolchain products (mix format, Cargo.lock, recon, bootstrap report)

          Generated by .github/workflows/ci-bootstrap.yml. No source semantics
          changed: this commit is `mix format` output, two generated Cargo.lock
          files, the pons-asinorum and panic-attack reports, and the report the
          workflow wrote beside them.'
          git push origin "HEAD:${GITHUB_REF_NAME}"
