#
# ci-bootstrap.yml — TEMPORARY. Delete after use.
#
# This branch was prepared in an environment with no Elixir, Erlang or Rust
# toolchain and no route to hex.pm or crates.io. Three things could therefore
# not be produced there, and each of them is a *mechanical* product of a
# toolchain rather than a design decision:
#
#   1. `mix format` — the repository has never been format-checked. `ci.yml`
#      (new in this branch) adds the check, and it fails. The drift is
#      pre-existing, repo-wide, and can only be removed by running the pinned
#      formatter.
#   2. `mix test` — the ~850-test suite had never run in CI. This job captures
#      the failure text, which the Actions log API does not expose here.
#   3. `Cargo.lock` for the two NIF crates under opsm_ex/native/ — neither has a
#      committed lock, so `cargo build --locked` fails before it compiles
#      anything. Only cargo can mint a lock that matches the manifests.
#
# So this workflow runs the real toolchains on a runner, writes everything it
# learns to .ci-bootstrap/report.txt, commits the result and pushes it back to
# the branch it ran on. The human (or agent) then reads the report from git
# rather than from a log it cannot fetch.
#
# It is not a gate, it is not required, and it is deleted once it has done its
# job. Nothing here weakens a check: the Formatter, Mix test and Build (locked)
# jobs in ci.yml stay exactly as strict as they are, and must pass on their own
# merits afterwards.
#
# Triggers only on a change to this file (i.e. the commit that adds it) and on
# manual dispatch, so it can never run as part of an ordinary pull request.
name: CI bootstrap (temporary)

on:
  push:
    paths:
      - '.github/workflows/ci-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: ci-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    name: Produce the toolchain artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the branch this ran on
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Erlang/Elixir from .tool-versions
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: '.tool-versions'
          version-type: 'strict'

      - name: Install Rust (the pin in .tool-versions comments)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.97.0'

      - name: Run the toolchain and record everything
        run: |
          set -uo pipefail
          out=.ci-bootstrap/report.txt
          mkdir -p .ci-bootstrap
          {
            echo "# CI bootstrap report"
            echo
            echo "Generated by .github/workflows/ci-bootstrap.yml on $(date -u +%FT%TZ)."
            echo "Commit: ${GITHUB_SHA}. Runner: ${RUNNER_OS} $(uname -m)."
            echo
            echo '## Versions'
            echo '```'
            elixir --version 2>&1 || true
            erl -noshell -eval 'io:format("erts ~s~n",[erlang:system_info(version)]),halt().' 2>&1 || true
            cargo --version 2>&1 || true
            rustc --version 2>&1 || true
            echo '```'
          } > "$out"

          section() { printf '\n## %s\n\n```\n' "$1" >> "$out"; }
          close() { printf '```\n' >> "$out"; }
          run() {
            # run LABEL CMD... — record the command, its output and its code.
            local label="$1"; shift
            section "$label (\$ $*)"
            "$@" >> "$out" 2>&1
            local rc=$?
            close
            printf '\nexit code: **%s**\n' "$rc" >> "$out"
            return 0
          }

          section 'mix deps.get'
          ( cd opsm_ex && mix deps.get ) >> "$out" 2>&1
          printf '\n' >> "$out"; close

          # 1. Format. This is the one step whose *purpose* is to change files.
          section 'mix format (rewrites files)'
          ( cd opsm_ex && mix format ) >> "$out" 2>&1
          close
          section 'git status after mix format'
          git status --porcelain >> "$out" 2>&1
          close
          run 'mix format --check-formatted' bash -lc 'cd opsm_ex && mix format --check-formatted'

          # 2. Strict compile — the second half of the lint job.
          run 'mix compile --warnings-as-errors' bash -lc 'cd opsm_ex && mix compile --warnings-as-errors'

          # 3. The suite, with the Proven-Tests reporter on, exactly as ci.yml
          #    runs it. Output is truncated to the last 500 lines: the summary,
          #    the failure list and the stack traces are at the end.
          section 'mix test --cover (last 500 lines)'
          ( cd opsm_ex && MIX_ENV=test OPSM_PROVEN_REPORT=1 mix test --cover 2>&1 | tail -500 ) >> "$out" 2>&1
          close
          run 'validate_proven.exs' bash -lc 'cd opsm_ex && mix run --no-start scripts/validate_proven.exs'
          run 'proven_summary.exs' bash -lc 'cd opsm_ex && mix run --no-start scripts/proven_summary.exs'

          # 4. Lockfiles for the two NIF crates.
          for crate in opsm_pq_nif quic_transport; do
            d="opsm_ex/native/${crate}"
            if [ -f "$d/Cargo.toml" ]; then
              run "cargo generate-lockfile (${crate})" bash -lc "cd '$d' && cargo generate-lockfile"
              # Does the crate actually build once it has a lock? If not, it
              # must stay out of the ci.yml matrix, and this is the evidence.
              run "cargo build --locked (${crate})" bash -lc "cd '$d' && cargo build --locked 2>&1 | tail -40"
            fi
          done

          # 5. Publish what changed, then commit it.
          section 'git status after the run'
          git status --porcelain >> "$out" 2>&1
          close
          section 'git diff --stat'
          git diff --stat >> "$out" 2>&1
          close

      - name: Commit the products and push them back to this branch
        run: |
          set -euo pipefail
          git config user.name 'ci-bootstrap'
          git config user.email 'ci-bootstrap@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit — the toolchain produced no change"
            exit 0
          fi
          git commit -m 'chore(ci): toolchain products (mix format, Cargo.lock, bootstrap report)

          Generated by .github/workflows/ci-bootstrap.yml. No source semantics
          changed: this commit is `mix format` output, two generated Cargo.lock
          files, and the report the workflow wrote beside them.'
          git push origin "HEAD:${GITHUB_REF_NAME}"
