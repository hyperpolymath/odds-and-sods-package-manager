#
# Secret Scanner wrapper — calls the estate reusable.
#
# PIN: hyperpolymath/standards@8e48b1c… — see governance.yml for why the
# previous 84355587… pin made every job fail at "Set up job" with
# "invalid lockfile pin".
#
# `scan / gitleaks` is a REQUIRED status check on main (ruleset
# "Secret-Scan-Floor"), so this wrapper is the single most load-bearing file in
# the repository: while it is broken, no pull request can merge, including the
# one that fixes it.
#
# The reusable declares `workflow_call.secrets` as empty and every one of its
# jobs runs with `permissions: contents: read` only. Grant less, not more:
#   * an over-grant here is rejected at startup (a called workflow may not
#     exceed its caller's grant), and
#   * gitleaks now runs as a checksum-verified binary rather than
#     gitleaks/gitleaks-action, so no pull-requests: write is needed and
#     `secrets: inherit` would forward secrets the callee never reads.
name: Secret Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
