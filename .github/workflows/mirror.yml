#
# Mirror to Git Forges — estate reusable wrapper.
#
# PIN: metadatastician/standards@8e48b1c… — see governance.yml.
#
# `secrets: inherit` is REQUIRED here (unlike secret-scanner): each forge job is
# gated on `vars.<FORGE>_MIRROR_ENABLED == 'true'` and reads that forge's SSH
# key from the caller's secrets. Without inherit, `${{ secrets.X }}` inside the
# reusable evaluates to empty and the job fails only on the forges you enabled.
name: Mirror to Git Forges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    uses: metadatastician/standards/.github/workflows/mirror-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
    secrets: inherit
