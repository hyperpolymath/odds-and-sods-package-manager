# SPDX-License-Identifier: MPL-2.0
# Build and push all OPSM trust pipeline + container security service images to GHCR.
#
# Trust pipeline services (always active, default compose):
#   claim-forge, checky-monkey, palimpsest-license, cicd-hyper-a, oikos
#
# Container security services (opt-in via --profile container-security):
#   svalinn, selur, vordr, cerro-torre

name: Trust Pipeline Images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/trust-pipeline-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # Trust pipeline (default compose stack)
          - service: claim-forge
          - service: checky-monkey
          - service: palimpsest-license
          - service: cicd-hyper-a
          - service: oikos
          # Container security (--profile container-security)
          - service: svalinn
          - service: selur
          - service: vordr
          - service: cerro-torre

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/hyperpolymath/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
