# SPDX-License-Identifier: PMPL-1.0-or-later
# Build and push all OPSM trust pipeline + container security service images to GHCR.
#
# Trust pipeline services (always active, default compose):
#   claim-forge, checky-monkey, palimpsest-license, cicd-hyper-a, oikos
#
# Container security services (opt-in via --profile container-security):
#   svalinn, selur, vordr, cerro-torre

name: Trust Pipeline Images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/trust-pipeline-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Trust pipeline (default compose stack)
          - service: claim-forge
            port: 8080
          - service: checky-monkey
            port: 8081
          - service: palimpsest-license
            port: 8082
          - service: cicd-hyper-a
            port: 8083
          - service: oikos
            port: 8084
          # Container security (--profile container-security)
          - service: svalinn
            port: 8085
          - service: selur
            port: 8086
          - service: vordr
            port: 8087
          - service: cerro-torre
            port: 8088

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Containerfile
          push: true
          tags: |
            ghcr.io/hyperpolymath/${{ matrix.service }}:latest
            ghcr.io/hyperpolymath/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
