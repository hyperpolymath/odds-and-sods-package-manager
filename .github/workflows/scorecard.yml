#
# OSSF Scorecard — estate reusable wrapper.
#
# PIN: hyperpolymath/standards@8e48b1c… — see governance.yml.
#
# Permissions must be granted at the caller. The reusable publishes SARIF to
# code scanning and pushes results to the public OpenSSF API, which needs
# `security-events: write` and `id-token: write`; a called workflow cannot
# escalate past the caller's grant, so a missing grant is a 0-job startup
# failure rather than a clear message.
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@cf8f91219d80da55cf8cbbfcd587d00c2d8798ed
