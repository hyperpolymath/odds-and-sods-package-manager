name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# The called reusable workflow needs security-events/id-token beyond the
# default; a reusable job cannot escalate past the caller's grant, so the
# run dies at startup ("startup_failure", 0 jobs) unless granted here.
permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@84355587cb2a1f86e6882de83514a32db2646e7a
