# SPDX-License-Identifier: MPL-2.0
name: OSSF Scorecard

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# The called reusable workflow needs security-events/id-token beyond the
# default; a reusable job cannot escalate past the caller's grant, so the
# run dies at startup ("startup_failure", 0 jobs) unless granted here.
permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@7fdc2705df74b4e352d2a1cde3e87a5923fdf329
