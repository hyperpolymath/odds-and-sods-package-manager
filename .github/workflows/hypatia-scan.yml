#
# Hypatia Neurosymbolic Security Scan — estate reusable wrapper.
#
# PIN: hyperpolymath/standards@8e48b1c… — see governance.yml for the
# "invalid lockfile pin" / "Set up job" failure this replaces.
#
# The reusable builds three scanners from source at pinned commits and runs
# them over the tree:
#   * hypatia      — the estate's rule engine (SD/SG rules),
#   * panic-attack — stress testing + logic-based bug-signature detection,
#   * pons-asinorum— depth-first static scan for wasted work, self-contradiction
#                    and missing escape hatches.
# It uploads SARIF to code scanning, so `security-events: write` is required and
# must be granted HERE: a called workflow cannot escalate past its caller.
#
# `block-on-high: false` keeps the lane advisory on high/critical findings until
# a `.hypatia-baseline.json` exists in this repository (there is none yet). Flip
# it to true in the same PR that lands the baseline; otherwise the gate is a
# rubber stamp that also blocks unrelated work.
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
    with:
      block-on-high: false
    secrets:
      # Read-only PAT for Dependabot / code-scanning alert reads. Optional: the
      # reusable falls back to the built-in token and says so in its output.
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
