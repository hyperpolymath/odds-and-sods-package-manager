#
# YAML policy — parse (blocking) and KYAML conformance (report-only).
#
# Policy: metadatastician/standards 3-practice/YAML-POLICY.adoc.
#   Y-1  IN FORCE      gates read YAML with yq, never grep/sed/awk.
#   Y-3  SEQUENCED     KYAML is the target authoring dialect; the scope of any
#                      mandate is not yet decided, so this job reports drift and
#                      only fails on it under --enforce.
#
# The blocking half is the parse check, and it has already earned its place:
# twelve tracked YAML files in this repository carried a C-style `// Copyright`
# line, which is not a YAML comment. They were unparseable and had been since
# they were written — `deploy/k8s/*.yaml`, `selur-compose.yml`,
# `docker-compose.dev.yml`, `opsm-ui/.gitlab-ci.yml`. A workflow file in that
# state produces a run with no jobs and no log rather than an error.
name: YAML — parse + KYAML

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - 'scripts/ci/check-yaml.sh'
      - '.github/workflows/yaml-kyaml.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  # Pinned to the version named in YAML-POLICY.adoc §0 (the estate workstation
  # build), so the report here matches the report there.
  YQ_VERSION: '4.53.3'
  # sha256 of yq_linux_amd64 for v4.53.3, taken from the release's own asset
  # digest (`gh api repos/mikefarah/yq/releases/tags/v4.53.3 --jq '.assets[]
  # | select(.name=="yq_linux_amd64") | .digest'`) and cross-checked against the
  # sha256 column of the release `checksums` asset.
  #
  # Deliberately NOT parsed out of `checksums` at run time. That asset is not a
  # `sha256sum -c` list: yq publishes several hashes per file, in the order
  # given by a second asset called `checksums_hashes_order`, and ships an
  # `extract-checksum.sh` helper because of it. The first version of this job
  # grepped for a `sha256sum`-style line, found none, and died with the grep's
  # exit status — which is why this is a literal now.
  YQ_SHA256: 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4'

jobs:
  parse:
    name: YAML parse + KYAML report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install yq (pinned by sha256)
        run: |
          set -euo pipefail
          base="https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}"
          curl -fsSLo /tmp/yq "${base}/yq_linux_amd64"
          printf '%s  %s\n' "${YQ_SHA256}" /tmp/yq | sha256sum --check --strict
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Parse every tracked YAML file
        run: bash scripts/ci/check-yaml.sh .

      - name: KYAML drift (report-only until Y-3 scope is decided)
        # Same run, same tool; the advisory lane exists so the scope decision in
        # Y-3 §3.3 can be made from measured data instead of a guess.
        continue-on-error: true
        run: |
          bash scripts/ci/check-yaml.sh . | tail -5
          {
            echo "### KYAML drift (advisory)"
            echo ""
            echo "YAML-POLICY Y-3 is sequenced: this repository reports KYAML drift,"
            echo "it does not fail on it. Workflows are excluded (bot-written)."
          } >> "$GITHUB_STEP_SUMMARY"
