# Compile the opsm_pq_nif Rust NIF and run :requires_nif tests.
# Separate from the main Elixir test job so NIF compilation doesn't
# block the standard unit test suite.

name: NIF Build + PQ Tests
on:
  push:
    branches: [main]
    paths:
      - "opsm_ex/native/opsm_pq_nif/**"
      - "opsm_ex/lib/opsm/crypto/**"
      - "opsm_ex/test/opsm/crypto/**"
      - ".github/workflows/nif-build.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  nif-build:
    name: Compile opsm_pq_nif + run PQ tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          # Pinned to the canonical rust version in opsm.toml [runtime]
          toolchain: '1.97.0'
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: opsm_ex/native/opsm_pq_nif -> target
      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          # Versions derive from opsm.toml [runtime] via .tool-versions
          # (generated by `just toolchain-sync` — see docs/TOOLCHAIN.adoc)
          version-file: '.tool-versions'
          version-type: 'strict'
      - name: Restore Mix cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            opsm_ex/deps
            opsm_ex/_build
          key: ${{ runner.os }}-mix-nif-${{ hashFiles('opsm_ex/mix.lock') }}
      - name: Install Elixir dependencies
        run: cd opsm_ex && mix deps.get
      - name: Build NIF (cargo build --release)
        run: |
          cd opsm_ex/native/opsm_pq_nif
          cargo build --release
          # Copy .so into the priv directory where Rustler expects it
          mkdir -p ../../priv/native
          cp target/release/libopsm_pq_nif.so ../../priv/native/libopsm_pq_nif.so 2>/dev/null || \
          cp target/release/libopsm_pq_nif.dylib ../../priv/native/libopsm_pq_nif.so 2>/dev/null || true
      - name: Compile Elixir with NIF
        run: cd opsm_ex && mix compile
      - name: Run PQ NIF tests
        run: cd opsm_ex && mix test --include requires_nif --only requires_nif --trace
