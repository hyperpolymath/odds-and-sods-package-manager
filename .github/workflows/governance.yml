#
# Governance wrapper — calls the estate reusable.
#
# PIN: hyperpolymath/standards@8e48b1c… (2026-10-25).
#
# The owner in the pin is hyperpolymath, not metadatastician, even though the
# repository has been renamed and the API follows the redirect. A three-way
# probe on 2026-10-25 established that GitHub's *workflow* resolver does not:
#
#   hyperpolymath/standards@8e48b1c      → the call loads
#   metadatastician/standards@75bd599    → startup_failure, no job, no log
#   hyperpolymath/standards@75bd599      → the call loads
#
# Only the owner name varied in that middle line. A startup_failure produces no
# check run at all, so a renamed owner is indistinguishable from "this gate
# does not exist yet" — and on this repository it made the only required check
# on main unreachable. Pin the name GitHub resolves, not the one the API prints.
#
# The previous pin (84355587…, 2026-08-27) shipped a lockfile with version
# v0.0.2 in which every dependency was keyed by a full-length commit SHA and
# recorded *that same SHA* as its `ref`. GitHub's workflow-dependency-lockfile
# enforcement (and `gh actions-lock` v0.0.3) rejects that shape as an
# "invalid lockfile pin", so every job of the called workflow died at
# "Set up job" before running a single step — the run reported `failure` with
# no log, no check output and no annotation on the PR. A reusable workflow is
# covered by the lockfile of the repository that DEFINES it, not by ours, so
# the only fix available to a caller is to move to a standards commit whose
# lockfile is valid. 8e48b1c records the human-readable tag in `ref` and is
# accepted.
#
# Do not "fix" a future failure of this job by pinning back: run
# `gh actions-lock --verify` in standards first.
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # Read-only check workflow: cancelling a superseded run is always safe.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  governance:
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@cf8f91219d80da55cf8cbbfcd587d00c2d8798ed
    # Fine-grained, read-only PAT. Optional: without it the workflow-staleness
    # and baseline jobs fall back to the built-in token and degrade loudly
    # rather than silently passing.
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
