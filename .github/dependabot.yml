#
# Dependabot — one entry per ecosystem that actually exists in this repository.
#
# The previous file declared npm, pip and nix ecosystems that have no manifest
# here (the repository is Elixir + Rust + Zig; TypeScript and npm were removed
# estate-wide in #94, and there is no flake.nix). Those entries produced nothing
# but noise, and a Dependabot config that describes a repository that no longer
# exists is a quiet way to stop reviewing dependency updates.
#
# `mix` pointed at "/" too, where there is no mix.exs — the project lives in
# opsm_ex/.
#
# github-actions updates MUST keep .github/workflows/actions.lock in step with
# the workflow files: GitHub enforces the lockfile at job start, and a bump that
# moves a `uses:` without moving its lockfile entry makes every job fail at
# "Set up job" with "invalid lockfile pin" — no log, no annotation. Dependabot
# does update the lockfile; review both halves in the same PR.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "mix"
    directory: "/opsm_ex"
    schedule:
      interval: "weekly"
    groups:
      mix:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "cargo"
    directories:
      - "/services/checky-monkey"
      - "/services/oikos"
      - "/services/palimpsest-license"
      - "/services/selur"
      - "/services/svalinn"
      - "/services/vordr"
      - "/opsm-ui/tui"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # Patch bumps of transitive crates are noise; the lockfile already pins
      # them and `cargo build --locked` in CI catches a broken resolution.
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: "chore(deps)"
