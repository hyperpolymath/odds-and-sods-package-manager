[package]
name = "opm"
version = "0.0.1"
edition = "2021"
license = "PMPL-1.0"
description = "Odds-and-sods package manager CLI"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
