# SPDX-License-Identifier: PMPL-1.0-or-later

[package]
name = "pq_crypto"
version = "0.1.0"
authors = ["Jonathan D.A. Jewell <jonathan.jewell@open.ac.uk>"]
edition = "2021"
description = "Post-quantum cryptographic NIFs for OPSM (Dilithium5, Kyber-1024, SPHINCS+)"
license = "PMPL-1.0-or-later"

[lib]
name = "pq_crypto"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Rustler for Erlang NIF bridge
rustler = "0.35"

# Post-quantum cryptography (NIST FIPS 204/203/205)
pqcrypto-dilithium = "0.5"
pqcrypto-kyber = "0.8"
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"
