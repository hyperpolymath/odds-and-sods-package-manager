[package]
name = "quic_transport"
version = "0.1.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
edition = "2021"
license = "MPL-2.0"
description = "QUIC/HTTP3 transport NIF for OPSM"

[lib]
name = "quic_transport"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.35"
quinn = "0.11"
h3 = "0.0.6"
h3-quinn = "0.0.7"
tokio = { version = "1", features = ["full"] }
bytes = "1"
http = "1"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
