# SPDX-License-Identifier: MPL-2.0
# Proven-Tests manifest — coordinates for every ExUnit module in opsm_ex/test.
#
# Framework: hyperpolymath/proven-tests-and-benches. A test's *warrant* is a
# first-class value, not a label:
#
#   actually_proven      a total, machine-checked proof exists (`proof` REQUIRED)
#   provisionally_proven framework/assertions are sound and the property is
#                        exercised over generated inputs (StreamData), not proofs
#   unproven             a hand-written example: one input, one output
#
# Honesty rule: an example-based test is `unproven`, however valuable it is.
# Do not promote a tier to make a report look better — the tier is a claim
# about evidence, and the report exists to make that claim visible.
#
# `file` is relative to this Mix project root (opsm_ex/), which is the
# working directory `scripts/validate_proven.exs` runs in. Writing the
# path from the repository root instead made all 60 entries fail to
# resolve — a path is part of the claim, so the validator checks it.
#
# Category/aspect enumerations are pinned to ProvenTests.Types (17 x 14).
# Adding a category upstream requires a change here too; scripts/validate_proven.exs
# fails on an unknown name.

[taxonomy]
name = "proven-tests-and-benches"
categories = 17
aspects = 14

