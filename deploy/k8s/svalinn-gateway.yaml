# Svalinn edge gateway — HTTPS/QUIC ingress with policy enforcement
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svalinn
  namespace: opsm
  labels:
    app.kubernetes.io/name: svalinn
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: opsm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: svalinn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: svalinn
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: opsm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: svalinn
          image: opsm-svalinn:latest
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: quic
              containerPort: 443
              protocol: UDP
          env:
            - name: RUST_LOG
              value: info
            - name: UPSTREAM_URL
              value: http://opsm:4050
            - name: BIND_ADDR
              value: "0.0.0.0:8443"
            - name: QUIC_BIND_ADDR
              value: "0.0.0.0:443"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: tls-certs
          secret:
            secretName: svalinn-tls
---
apiVersion: v1
kind: Service
metadata:
  name: svalinn
  namespace: opsm
  labels:
    app.kubernetes.io/name: svalinn
    app.kubernetes.io/component: gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: svalinn
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: quic
      port: 443
      targetPort: quic
      protocol: UDP
