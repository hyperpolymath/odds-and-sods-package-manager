# Rust microservices: checky-monkey, palimpsest, oikos

---
# ==========================================================================
# Checky Monkey — Code Verification
# ==========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checky-monkey
  namespace: opsm
  labels:
    app.kubernetes.io/name: checky-monkey
    app.kubernetes.io/component: verification
    app.kubernetes.io/part-of: opsm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checky-monkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checky-monkey
        app.kubernetes.io/component: verification
        app.kubernetes.io/part-of: opsm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checky-monkey
          image: opsm-checky-monkey:latest
          ports:
            - containerPort: 7002
          env:
            - name: RUST_LOG
              value: info
            - name: BIND_ADDR
              value: "0.0.0.0:7002"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 7002
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: checky-monkey
  namespace: opsm
spec:
  selector:
    app.kubernetes.io/name: checky-monkey
  ports:
    - port: 7002
      targetPort: 7002

