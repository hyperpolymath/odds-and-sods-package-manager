apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsm
  namespace: opsm
  labels:
    app.kubernetes.io/name: opsm
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: opsm
    app.kubernetes.io/version: "1.2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opsm
      app.kubernetes.io/component: core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsm
        app.kubernetes.io/component: core
        app.kubernetes.io/part-of: opsm
        app.kubernetes.io/version: "1.2.0"
    spec:
      serviceAccountName: opsm
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opsm
          image: opsm:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 4050
              protocol: TCP
            - name: mobile-api
              containerPort: 4051
              protocol: TCP
          env:
            - name: MIX_ENV
              value: prod
            - name: OPSM_CHECKY_MONKEY_URL
              value: http://checky-monkey:7002
            - name: OPSM_PALIMPSEST_URL
              value: http://palimpsest:7003
            - name: OPSM_OIKOS_URL
              value: http://oikos:7005
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: registry
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: registry
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /app/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opsm-data
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
