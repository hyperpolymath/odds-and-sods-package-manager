# ---------------------------------------------------------------------------
# Package manifest (Hyperpolymath Forge Registry metadata)
# The [package] section makes OPSM itself a first-class HFR package.
# `opsm info opsm --registry hf` returns this metadata.
# ---------------------------------------------------------------------------

[package]
name = "odds-and-sods-package-manager"
version = "2.0.0"
description = "OPSM — federated universal package manager with 101+ registry adapters, trust pipeline, post-quantum crypto, and complete asdf replacement"
license = "PMPL-1.0-or-later"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
keywords = ["package-manager", "federated", "trust", "post-quantum", "runtime-manager", "hyperpolymath"]
homepage = "https://github.com/hyperpolymath/odds-and-sods-package-manager"
repository = "https://github.com/hyperpolymath/odds-and-sods-package-manager"
forth = "elixir"

[opsm]
# Self-referential: OPSM is its own package manager
trust_level = "hyperpolymath"
registry = "hf"
self_hosted = true

[runtime]
# Pinned tool versions — managed by OPSM runtime extension (replaces .tool-versions)
elixir = "1.16.0"
erlang = "26.2.0"
just = "1.46.0"
deno = "2.6.10"
zig = "0.14.0"
