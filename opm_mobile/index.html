<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPM Mobile</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #1a1a1a;
        color: #f0f0f0;
      }

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .nav {
        display: flex;
        gap: 1rem;
        padding: 1rem;
        background: #2a2a2a;
        border-bottom: 2px solid #3a3a3a;
      }

      .nav button {
        padding: 0.5rem 1rem;
        background: #3a3a3a;
        color: #f0f0f0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.2s;
      }

      .nav button:hover {
        background: #4a4a4a;
      }

      .main-content {
        flex: 1;
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }

      .error-banner {
        background: #ff4444;
        color: white;
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .error-banner button {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
      }

      .home h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #4a9eff;
      }

      .home p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        color: #aaa;
      }

      .search-box {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .search-box input {
        flex: 1;
        padding: 0.75rem;
        font-size: 1rem;
        background: #2a2a2a;
        color: #f0f0f0;
        border: 2px solid #3a3a3a;
        border-radius: 4px;
      }

      .search-box input:focus {
        outline: none;
        border-color: #4a9eff;
      }

      .search-box button,
      .quick-actions button,
      .package-card button {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        background: #4a9eff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .search-box button:hover,
      .quick-actions button:hover,
      .package-card button:hover {
        background: #3a8eef;
      }

      .search-box button:disabled,
      .package-card button:disabled {
        background: #666;
        cursor: not-allowed;
      }

      .quick-actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .package-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        margin-top: 2rem;
      }

      .package-card {
        background: #2a2a2a;
        padding: 1.5rem;
        border-radius: 8px;
        border: 2px solid #3a3a3a;
        transition: border-color 0.2s;
      }

      .package-card:hover {
        border-color: #4a9eff;
      }

      .package-card h3 {
        color: #4a9eff;
        margin-bottom: 0.5rem;
        font-size: 1.3rem;
      }

      .package-card .registry {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }

      .package-card .description {
        color: #ccc;
        margin-bottom: 1rem;
        line-height: 1.5;
      }

      .package-card .license {
        color: #aaa;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }

      .package-card button {
        margin-right: 0.5rem;
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      }

      .package-detail {
        background: #2a2a2a;
        padding: 2rem;
        border-radius: 8px;
        border: 2px solid #3a3a3a;
      }

      .package-detail h2 {
        color: #4a9eff;
        margin-bottom: 1rem;
        font-size: 2rem;
      }

      .package-detail .version,
      .package-detail .registry,
      .package-detail .license {
        color: #aaa;
        margin-bottom: 0.5rem;
      }

      .package-detail .description {
        color: #ccc;
        margin: 1.5rem 0;
        line-height: 1.6;
        font-size: 1.1rem;
      }

      .package-detail .homepage a {
        color: #4a9eff;
        text-decoration: none;
      }

      .package-detail .homepage a:hover {
        text-decoration: underline;
      }

      .package-detail button {
        margin-top: 1.5rem;
        padding: 1rem 2rem;
        font-size: 1.1rem;
      }

      h2 {
        color: #4a9eff;
        margin-bottom: 1.5rem;
      }

      .search-results p {
        color: #aaa;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.res.js"></script>
  </body>
</html>
