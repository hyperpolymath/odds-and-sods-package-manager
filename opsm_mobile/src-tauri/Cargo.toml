[package]
name = "opsm-mobile"
version = "1.0.0"
description = "OPSM Mobile - Native iOS/Android wrapper for Odds and Sods Package Manager"
authors = ["Jonathan D.A. Jewell <jonathan.jewell@open.ac.uk>"]
license = "PMPL-1.0-or-later"
repository = "https://github.com/hyperpolymath/odds-and-sods-package-manager"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri 2.x build tooling — pinned to 2.5.x; resolves to 2.5.6 as of 2026-03-10
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Tauri 2.x runtime — pinned to 2.9+; resolves to 2.10.3 as of 2026-03-10
# tauri-cli installed: 2.10.0 (keep in sync with runtime)
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
